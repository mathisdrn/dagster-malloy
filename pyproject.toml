[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-malloy"
version = "0.2.6"
description = "Unofficial Dagster integration for Malloy models and notebooks"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Mathis Derenne", email = "mathis.derenne@gmail.com" }
]
dependencies = [
    "dagster>=1.6.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mathisdrn/dagster-malloy"
Repository = "https://github.com/mathisdrn/dagster-malloy"
Issues = "https://github.com/mathisdrn/dagster-malloy/issues"

[project.scripts]
dagster-malloy = "dagster_malloy.cli:main"
dagster-malloy-demo = "dagster_malloy_demo.cli:run_demo"

[project.optional-dependencies]
execution = [
    "polars>=0.20.0",
]
dev = [
    "dagster-dg-cli>=1.12.0",
    "dagster-webserver>=1.6.0",
]
test = [
    "pytest>=7.0.0",
    "duckdb>=0.9.0",
    "polars>=0.20.0",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_malloy_demo"

[tool.hatch.build.targets.wheel]
packages = ["dagster_malloy", "dagster_malloy_demo"]
include = [
    "dagster_malloy_demo/models/*.malloy",
    "dagster_malloy_demo/definitions.py",
    "dagster_malloy_demo/generate_data.py",
    "dagster_malloy_demo/asset_lineage.png",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
filterwarnings = [
    "ignore::dagster_shared.utils.warnings.BetaWarning",
]
